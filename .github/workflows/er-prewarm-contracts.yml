name: ER pre-warm contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Infinitemind-im/nexus-core-v2
          ref: bc96c64df71854500fe02e8c81f77b8b676120f9
          path: .runtime-src/nexus-core
          token: ${{ secrets.NEXUS_GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create isolated fixture runtime
        run: |
          python -m venv "${RUNNER_TEMP}/er-prewarm-${GITHUB_RUN_ID}"
          echo "${RUNNER_TEMP}/er-prewarm-${GITHUB_RUN_ID}/bin" >> "$GITHUB_PATH"
      - name: Install published library dependencies
        run: |
          python -m pip install .runtime-src/nexus-core 'pyspark==3.5.0' neo4j jellyfish metaphone pydantic-settings prometheus-client opentelemetry-sdk datasketch asyncpg pytest 'testcontainers==4.15.0' 'redis==5.1.1' 'psycopg[binary]==3.2.3' 'psycopg2-binary==2.9.10' 'requests==2.32.3' 'confluent-kafka==2.5.3' 'python-dateutil==2.9.0.post0' 'minio==7.2.9'
          python -m pip install --no-deps .
      - name: Verify real 50000-row ER partition pre-warm
        env:
          RUN_ER_PREWARM_INTEGRATION: '1'
        run: python -m pytest -q -s tests/unit/test_er_prewarm.py tests/integration/test_er_prewarm_cache.py tests/unit/test_backfill_contracts.py tests/unit/test_extract_registry.py tests/unit/test_salesforce_auth.py tests/unit/test_backfill_archive.py tests/integration/test_backfill_database.py tests/integration/test_backfill_archive.py
